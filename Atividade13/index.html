<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .container {
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <label for="textoEntrada">Digite um texto:</label><br>
    <input type="text" id="textoEntrada" size="40">

    <div class="container">
        <input type="radio" id="radioMaiuscula" name="tipoCase" onclick="transformarTexto()">
        <label for="radioMaiuscula">Letras Maiúsculas</label>
        <br>
        <input type="radio" id="radioMinuscula" name="tipoCase" onclick="transformarTexto()">
        <label for="radioMinuscula">Letras Minúsculas</label>
    </div>

    <script>
        function transformarTexto() {
            const inputTexto = document.getElementById('textoEntrada');
            
            const radioMaiuscula = document.getElementById('radioMaiuscula');
            const radioMinuscula = document.getElementById('radioMinuscula');

            if (radioMaiuscula.checked) {
                inputTexto.value = inputTexto.value.toUpperCase();
            } else if (radioMinuscula.checked) {
                inputTexto.value = inputTexto.value.toLowerCase();
            }
        }
    </script>

</body>
</html>
