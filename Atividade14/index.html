<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atividade 14</title>

<style>
body{
    font-family: Arial, Helvetica, sans-serif;
    background:#1ea5e6;
}

form{
    width:500px;
    margin:30px auto;
    background:#29a9eb;
    padding:20px;
    color:white;
    border-radius:10px;
}

h1{
    text-align:center;
}

label{
    display:block;
    margin-top:15px;
}

input[type=text],
input[type=email],
textarea{
    width:100%;
    padding:8px;
}

textarea{
    height:120px;
}

.botoes{
    margin-top:20px;
    text-align:center;
}

.pesquisa{
    margin-top:20px;
    text-align:center;
}
</style>

<script>

function validar(){

        let nome = document.nomeform.elements["nome"].value.trim();
    let email = document.nomeform.elements["email"].value.trim();
    let comentario = document.nomeform.elements["comentario"].value.trim();

    if(nome.length < 10){
        alert("O nome deve possuir no mínimo 10 caracteres.");
        return false;
    }

    if(email == ""){
        alert("Informe um e-mail.");
        return false;
    }

    if(comentario.length < 20){
        alert("O comentário deve possuir no mínimo 20 caracteres.");
        return false;
    }

    let pesquisa = document.getElementsByName("pesquisa");
    let escolhido = "";

    for(let i=0; i<pesquisa.length; i++){
        if(pesquisa[i].checked){
            escolhido = pesquisa[i].value;
        }
    }

    if(escolhido == ""){
        alert("Selecione uma opção da pesquisa.");
        return false;
    }

    if(escolhido == "sim"){
        alert("Que bom que você voltou a visitar esta página!");
    }else{
        alert("Volte sempre à esta página!");
    }

    return true;
}

</script>

</head>
<body>

<form name="nomeform" onsubmit="return validar()">

<h1>Formulário Principal</h1>

<label>Nome:</label>
<input type="text" name="nome">

<label>E-mail:</label>
<input type="email" name="email">

<label>Comentário:</label>
<textarea name="comentario"></textarea>

<div class="pesquisa">

<h3>Pesquisa</h3>

<p>Primeira vez nesta página?</p>

<input type="radio" name="pesquisa" value="sim">
<label style="display:inline;">Sim</label>

<input type="radio" name="pesquisa" value="nao">
<label style="display:inline;">Não</label>

</div>

<div class="botoes">
<input type="submit" value="Enviar">
<input type="reset" value="Limpar">
</div>

</form>

</body>
</html>
