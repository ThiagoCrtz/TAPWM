<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora de IMC</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 50px;
      }
      .box {
        max-width: 300px;
        margin: 0 auto;
        border: 1px solid #ccc;
        padding: 20px;
      }
      h2 {
        margin-top: 0;
      }
      input {
        display: block;
        width: 100%;
        padding: 8px;
        margin-bottom: 15px;
        box-sizing: border-box;
      }
      button {
        padding: 10px;
        cursor: pointer;
      }
      #outputDiv {
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h2>Calculadora IMC</h2>
      
      <input id="alturaInput" maxlength="4" type="text" placeholder="Altura (ex: 1.75)" autocomplete="off" />
      <input id="pesoInput" type="number" step="0.1" placeholder="Peso (ex: 80.5)" autocomplete="off" />

      <button id="enviarBtn">Calcular</button>
      <button id="limparBtn">Limpar</button>

      <div id="outputDiv"></div>
    </div>

    <script>
      const dadoAltura = document.getElementById("alturaInput");
      const dadoPeso = document.getElementById("pesoInput");
      const botaoEnviar = document.getElementById("enviarBtn");
      const botaoLimpar = document.getElementById("limparBtn");
      const outputDiv = document.getElementById("outputDiv");

      dadoAltura.addEventListener("input", (e) => {
        const v = e.target.value.replace(/\D/g, "");
        e.target.value = v.length > 1 ? `${v[0]}.${v.substring(1, 3)}` : v;
      });

      const calcularImc = (peso, altura) => (peso / (altura ** 2)).toFixed(2);

      const classificarImc = (imc) => {
        if (imc < 18.5) return "Magreza - 0";
        if (imc <= 24.9) return "Normal - 0";
        if (imc <= 29.9) return "Sobrepeso - 1";
        if (imc <= 39.9) return "Obesidade - 2";
        return "Obesidade grave - 3";
      };

      botaoEnviar.addEventListener("click", () => {
        const altura = parseFloat(dadoAltura.value);
        const peso = parseFloat(dadoPeso.value);

        if (!altura || !peso) {
          outputDiv.textContent = "Por favor, preencha ambos os campos.";
          return;
        }

        const imc = calcularImc(peso, altura);
        const classificacao = classificarImc(imc);

        outputDiv.textContent = `Seu IMC é ${imc} - ${classificacao}`;
      });

      botaoLimpar.addEventListener("click", () => {
        dadoAltura.value = "";
        dadoPeso.value = "";
        outputDiv.textContent = "";
      });
    </script>
  </body>
</html>
